<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Add Transaction — Ledgr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="transactions.css" />
</head>
<body>

<!-- Trigger Button for Preview -->
<div style="padding: 3rem; text-align: center;">
  <button onclick="document.getElementById('add-modal').showModal()" class="btn-primary" style="width: auto; padding: 0 1.5rem;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14"/><path d="M12 5v14"/>
    </svg>
    <span>Add transaction</span>
  </button>
</div>

<!-- The Modal -->
<dialog id="add-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Add Transaction</h2>
      <button type="button" class="btn-icon" onclick="document.getElementById('add-modal').close()" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <form method="dialog" class="modal-form">

      <div class="form-row">
        <!-- Date -->
        <div class="field">
          <label class="label">Date</label>
          <input type="date" placeholder="YYYY-MM-DD">
        </div>

        <!-- Type -->
        <div class="field">
          <label class="label">Type</label>
          <select class="filter-select">
            <option value="" disabled selected>Select type</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <!-- Account -->
        <div class="field">
          <label class="label">Account</label>
          <input type="text" placeholder="e.g. Chase Checking">
        </div>

        <!-- Amount -->
        <div class="field">
          <label class="label">Amount</label>
          <div class="input-with-symbol">
            <span class="currency-symbol">$</span>
            <input type="number" step="0.01" placeholder="0.00">
          </div>
        </div>
      </div>

      <!-- Description -->
      <div class="field">
        <label class="label">Description</label>
        <input type="text" placeholder="What was this for?">
      </div>

      <div class="form-row">
        <!-- Category -->
        <div class="field">
          <label class="label">Category</label>
          <select class="filter-select">
            <option value="" disabled selected>Select category</option>
            <option value="software">Software</option>
            <option value="office">Office</option>
            <option value="income">Income</option>
          </select>
        </div>

        <!-- Bucket -->
        <div class="field">
          <label class="label">Bucket</label>
          <select class="filter-select">
            <option value="" disabled selected>Select bucket</option>
            <option value="needs">Needs</option>
            <option value="wants">Wants</option>
            <option value="savings">Savings</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="document.getElementById('add-modal').close()">Cancel</button>
        <button type="submit" class="btn-primary" style="width: auto; padding: 0 2rem;">Save</button>
      </div>

    </form>
  </div>
</dialog>

<script>
  // Close modal when clicking outside the content area
  document.getElementById('add-modal').addEventListener('click', function(e) {
    if (e.target === this) this.close();
  });
</script>

</body>
</html>
